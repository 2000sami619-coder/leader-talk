  :root{
    --navy:#0F2E6E; --blue:#1F63E8; --aqua:#17B8C4; --orange:#F26A21;
    --blue-soft:#EAF1FE; --aqua-soft:#E3F7F9; --orange-soft:#FEF0E8;
    --ink:#12172B; --sub:#5C6480; --faint:#9AA2BC;
    --bg:#F7F8FC; --card:#FFF; --line:#E9ECF5; --fill:#F1F3FA;
    --font:'Pretendard','Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:var(--font);background:var(--bg);color:var(--ink);
    display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;overscroll-behavior:none}

  /* ── 상단바 ── */
  header{display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;flex-shrink:0}
  .logo{display:flex;align-items:center;gap:9px}
  .mark{width:26px;height:26px;border-radius:9px;
    background:linear-gradient(135deg,var(--blue),var(--aqua));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:900}
  .logo b{font-size:15px;letter-spacing:-.01em}
  header button{font-family:var(--font);background:var(--fill);border:none;font-size:12.5px;
    font-weight:700;color:var(--sub);cursor:pointer;padding:7px 13px;border-radius:99px;visibility:hidden}

  main{flex:1;overflow-y:auto;width:100%}
  .wrap{max-width:600px;margin:0 auto;padding:0 16px 24px}

  /* ── 랜딩 ── */
  .land{min-height:calc(100vh - 120px);display:flex;flex-direction:column;
    justify-content:center;padding:20px 16px 40px;max-width:600px;margin:0 auto}
  .hi{font-size:13px;font-weight:800;color:var(--blue);letter-spacing:.06em;margin-bottom:14px}
  .land h1{font-size:34px;line-height:1.28;letter-spacing:-.03em;font-weight:800;margin-bottom:18px}
  .land h1 .g{background:linear-gradient(120deg,var(--blue),var(--aqua));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .land .lead{font-size:15px;line-height:1.75;color:var(--sub);margin-bottom:12px}
  .kit{background:var(--card);border-radius:20px;padding:16px 18px;margin-bottom:26px;
    border:1px solid var(--line)}
  .kit p{font-size:13px;color:var(--sub);line-height:1.6;margin-bottom:10px}
  .kit ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .kit li{font-size:13.5px;font-weight:600;display:flex;gap:8px;align-items:flex-start;line-height:1.5}
  .kit li i{font-style:normal;flex-shrink:0}

  .bigbox{background:var(--card);border-radius:26px;border:1.5px solid var(--line);
    padding:8px 8px 8px 20px;display:flex;align-items:flex-end;gap:10px;
    box-shadow:0 8px 30px rgba(18,23,43,.07);transition:border-color .15s}
  .bigbox:focus-within{border-color:var(--blue)}
  .bigbox textarea{flex:1;font-family:var(--font);font-size:15.5px;line-height:1.6;color:var(--ink);
    border:none;background:transparent;padding:14px 0;resize:none;outline:none;max-height:150px}
  .go{width:40px;height:40px;border-radius:50%;border:none;flex-shrink:0;margin-bottom:4px;
    background:var(--fill);color:var(--faint);font-size:17px;font-weight:800;cursor:default;line-height:1}
  .go.on{background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff;cursor:pointer}

  .exs{display:flex;gap:7px;flex-wrap:wrap;margin-top:16px}
  .exs button{font-family:var(--font);font-size:12.5px;font-weight:600;color:var(--sub);
    background:var(--card);border:1px solid var(--line);padding:9px 14px;border-radius:99px;cursor:pointer}
  .exs button:hover{border-color:var(--blue);color:var(--blue)}

  /* ── 채팅 ── */
  .row{display:flex;gap:9px;margin-bottom:16px;align-items:flex-start}
  .av{width:28px;height:28px;border-radius:10px;flex-shrink:0;margin-top:2px;
    background:linear-gradient(135deg,var(--blue),var(--aqua));
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:900}
  .bot{background:var(--card);border-radius:6px 18px 18px 18px;padding:13px 16px;max-width:82%;
    font-size:15px;line-height:1.7;white-space:pre-wrap;box-shadow:0 1px 3px rgba(18,23,43,.05)}
  .me-row{display:flex;justify-content:flex-end;margin-bottom:16px}
  .me{background:var(--navy);border-radius:18px 6px 18px 18px;padding:13px 16px;max-width:82%;
    font-size:15px;line-height:1.7;color:#fff;white-space:pre-wrap}
  .chips{display:flex;gap:7px;flex-wrap:wrap;margin:-6px 0 16px 37px}
  .chips button{font-family:var(--font);font-size:12.5px;font-weight:700;color:var(--blue);
    background:var(--blue-soft);border:none;padding:9px 14px;border-radius:99px;cursor:pointer}
  .typing{background:var(--card);border-radius:6px 18px 18px 18px;padding:15px 17px;display:flex;gap:5px;
    box-shadow:0 1px 3px rgba(18,23,43,.05)}
  .typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:bl 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.18s}
  .typing i:nth-child(3){animation-delay:.36s}
  @keyframes bl{0%,60%,100%{opacity:.25}30%{opacity:1}}

  .composer{padding:10px 16px calc(14px + env(safe-area-inset-bottom));background:var(--bg);
    border-top:1px solid var(--line);flex-shrink:0}
  .composer .inner{max-width:600px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;
    background:var(--card);border-radius:24px;padding:7px 7px 7px 18px;border:1.5px solid var(--line)}
  .composer .inner:focus-within{border-color:var(--blue)}
  .composer textarea{flex:1;font-family:var(--font);font-size:15px;line-height:1.6;color:var(--ink);
    border:none;background:transparent;padding:9px 0;resize:none;outline:none;max-height:120px}
  .send{width:36px;height:36px;border-radius:50%;border:none;background:var(--fill);color:var(--faint);
    font-size:16px;font-weight:800;flex-shrink:0;line-height:1;cursor:default}
  .send.on{background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff;cursor:pointer}

  /* ── 결과 ── */
  .card{background:var(--card);border-radius:22px;padding:20px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(18,23,43,.05)}

  .sect b{font-size:15px;letter-spacing:-.01em}
  .sect span{font-size:12px;color:var(--faint)}

  .hero{background:linear-gradient(140deg,var(--navy),#1B4CA8 60%,var(--blue));
    box-shadow:0 10px 30px rgba(15,46,110,.24)}
  .hero .eb{font-size:11.5px;font-weight:800;letter-spacing:.12em;color:var(--aqua);margin-bottom:11px}
  .hero .pt{font-size:16.5px;line-height:1.65;color:#fff;font-weight:600;margin-bottom:16px;letter-spacing:-.01em}
  .hero .tag{display:inline-block;font-size:12px;font-weight:700;color:#fff;
    background:rgba(255,255,255,.18);padding:5px 12px;border-radius:99px}
  .hero .dv{border-top:1px solid rgba(255,255,255,.18);margin-top:16px;padding-top:15px}
  .hero h5{font-size:11.5px;font-weight:800;color:var(--aqua);margin-bottom:8px}
  .hero p{font-size:13.5px;line-height:1.75;color:#E4EBFA}

  .opt{padding:0;overflow:hidden;border:1.5px solid transparent;transition:border-color .15s}
  .opt.on{border-color:var(--blue)}
  .opt>button{width:100%;text-align:left;font-family:var(--font);background:none;border:none;
    padding:20px;cursor:pointer;display:block}
  .tags{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:800;padding:5px 11px;border-radius:99px}
  .tag.mint{color:#0E8A93;background:var(--aqua-soft)}
  .tag.amber{color:#B65A12;background:var(--orange-soft)}
  .tag.coral{color:#C4432E;background:#FCEBE7}
  .basis{font-size:11.5px;color:var(--faint)}
  .head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .head b{font-size:16px;line-height:1.45;letter-spacing:-.01em}
  .chev{font-size:17px;color:var(--faint);line-height:1;transition:transform .2s;flex-shrink:0;margin-top:3px}
  .opt.on .chev{transform:rotate(180deg)}
  .adesc{font-size:13px;color:var(--sub);line-height:1.55;margin-top:7px}
  .body{padding:0 20px 20px}
  .note{background:var(--orange-soft);color:#B4400F;font-size:13px;font-weight:700;
    border-radius:14px;padding:12px 14px;line-height:1.6;margin-bottom:15px}

  .first{background:var(--ink);border-radius:18px;padding:17px;margin-bottom:15px}
  .first .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}

  .first .copy{font-family:var(--font);font-size:12px;font-weight:700;color:#C3C9DC;

  .first .copy.done{color:var(--aqua)}
  .first .txt{font-size:16px;font-weight:700;color:#fff;line-height:1.7}

  .stat span{font-size:11.5px;font-weight:700;background:var(--fill);color:var(--sub);
    padding:6px 11px;border-radius:99px}
  .src{font-size:11.5px;color:var(--faint);line-height:1.6;text-align:center;margin:14px 6px 0}
  .kv{margin-bottom:14px}
  .kv:last-child{margin-bottom:0}
  .kv b{display:block;font-size:11.5px;font-weight:800;color:var(--blue);margin-bottom:5px}
  .kv p{font-size:14px;color:var(--sub);line-height:1.75}
  .more{margin-top:16px;padding-top:15px;border-top:1px solid var(--line)}
  .more h6{font-size:11.5px;font-weight:800;color:var(--faint);letter-spacing:.06em;margin-bottom:9px}
  .mini{font-size:13px;color:var(--sub);line-height:1.6;padding:8px 0;border-bottom:1px dashed var(--line)}
  .mini:last-child{border-bottom:none}
  .mini b{font-weight:800;color:var(--ink)}

  .pr{padding-bottom:15px;margin-bottom:15px;border-bottom:1px solid var(--line)}
  .pr:last-child{padding-bottom:0;margin-bottom:0;border-bottom:none}
  .pr b{display:block;font-size:15px;margin-bottom:4px}
  .pr p{font-size:13.5px;color:var(--sub);line-height:1.6}
  .soft{background:var(--fill);box-shadow:none}
  .soft b{display:block;font-size:15.5px;margin-bottom:6px}
  .soft p{font-size:13.5px;color:var(--sub);line-height:1.7}
  .hrbox{background:var(--blue-soft);box-shadow:none}
  .hrbox b{display:block;font-size:15px;color:var(--navy);margin-bottom:5px}
  .hrbox p{font-size:13.5px;color:var(--navy);line-height:1.65;opacity:.82}
  .contrib{background:var(--ink);box-shadow:none}
  .contrib b{display:block;font-size:15px;color:#fff;margin-bottom:6px}
  .contrib p{font-size:13.5px;color:#A6ADC6;line-height:1.65}

  .actions{display:flex;gap:8px;margin-top:14px}
  .actions button{flex:1;height:50px;border-radius:16px;font-family:var(--font);
    font-size:14.5px;font-weight:700;cursor:pointer;border:1.5px solid var(--line);
    background:var(--card);color:var(--ink)}
  .actions button.pri{border:none;background:linear-gradient(135deg,var(--blue),var(--aqua));color:#fff}

  .spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);
    border-top-color:var(--blue);margin:0 auto 18px;animation:sp .8s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}
  .load{padding:130px 0;text-align:center}
  .load .t{font-size:14.5px;font-weight:700}
  footer{padding:12px 18px calc(18px + env(safe-area-inset-bottom));text-align:center;
    font-size:11.5px;color:var(--faint);line-height:1.7;flex-shrink:0}
  .hidden{display:none !important}
</style>
</head>

  "근태": ["지각","늦","출근","조퇴","결근","병가","자리비움","무단","재택","연차","휴가","시간을 안"],
  "업무 실수": ["실수","오류","누락","잘못","사고","오타","오기입","불량","빠뜨","틀렸","손해","손실","클레임","컴플레인","은폐","숨기"],
  "팀원 간 갈등": ["갈등","싸움","싸워","싸우","싸운","다툼","다투","불화","험담","뒷말","마찰","냉전","충돌","사이가","트러블","앙금"],
  "소통·회의": ["회의","침묵","말이 없","의견","공유","보고","답이 없","메신저","되묻"],
  "성과 저하": ["성과","실적","목표치","떨어","저하","미달","동기","의욕","무기력","집중","산출물","대충","미뤄","미룬","미룹"],
  "평가·피드백": ["평가","피드백","지적","이의","승진","고과","납득","방어","변명","반박","듣지를 않","말을 안 들"],
  "업무 분장": ["분장","분배","배분","역할","떠넘","몰려","왜 저만","잡무","업무량","나눠"],
  "이탈 징후": ["퇴사","이직","그만두","그만둔","사직","나간다","나가겠","떠나","붙잡"],
  "과부하": ["야근","과부하","번아웃","소진","지쳐","힘들어","바쁘","일정이 밀","여유가"],
  "세대 차이": ["세대","나이","요즘 애","꼰대","회식","사적","선배","후배","가치관","워라밸"],
  "일정·의사결정": ["기한","마감","의사결정","지연","클라이언트","우선순위"],
  "부서 간 조율": ["타 부서","부서 간","협업 부서","유관","조율"],
  "태도": ["태도","말투","불성실","무례","성의","표정","반말","건성","삐딱","까칠","술","음주","막말","예의"],

/* ── 표지 ── */
var GUESS_MARK = ["것 같","듯","느낌","보인다","보여","아마","인 것","생각이","걱정","우려","신경 쓰","눈치"];
var GOAL_MARK  = ["원해","원합니","싶어","싶습니","했으면","바뀌","유지","회복","경고","정리하고","끝내","개선","안 했으면","바꾸고"];
var PRIOR_MARK = ["말했","말한","얘기했","이야기했","면담","지적","언급","경고","주의","불렀","없습니다","없어요","안 했","아무것도","처음","해봤","해봤는데"];
var WHEN_MARK  = ["주째","개월","달째","년째","매일","자주","계속","반복","번째","어제","지난","최근","오늘","이번","한 달","일주일"];
var EMO_MARK   = ["답답","짜증","힘들","괴롭","스트레스","화가","속상","서운","막막","지친","눈물","불안","무섭"];

var SCOPE_STRONG = ["날씨","뭐 먹","뭘 먹","메뉴","맛집","로또","주식","코인","여행 추천","영화 추천","노래 추천"];
var SCOPE_CASUAL = ["점심","저녁","주식","로또","영화","여행"];
var SCOPE_POLICY = ["횡령","해고","징계","고소","고발","법적","소송","취업규칙","근로기준법","산재","형사","배임","성희롱","괴롭힘 신고","노무"];
var SCOPE_SELF   = ["제가 소리","내가 소리","제가 화를","내가 화를","제가 때","폭언","제가 무시","제가 욕","제가 괴롭"];

var REDIRECT_MARK = ["말고","대신","보다는","아니라","아니고","그건 됐","다른 걸로","바꿔서"];
var REJECT_MARK   = ["이미 해봤","해봤는데","효과가 없","소용없","안 통","다른 방법","다른 방식","말고 다른","별로"];
var FOLLOWUP_MARK = ["저번에","지난번","아까","그 직원","그 팀원","말씀해주신","알려주신"];

/* ── 오타 보정 ── */
var TYPO = { "계쏙":"계속","햬요":"해요","헤요":"해요","됬":"됐","안되":"안 되","할려":"하려","어떻해":"어떻게" };
function fix(t){
  var s = String(t || "");
  s = s.replace(/[ㄱ-ㅎㅏ-ㅣ]+/g, "");          // 낱자 제거 (직ㅇ원 → 직원)
  Object.keys(TYPO).forEach(function(k){ s = s.split(k).join(TYPO[k]); });
  return s;
}
function norm(s){ return fix(s).replace(/\s+/g," ").trim(); }
function has(t, arr){ return arr.some(function(k){ return t.indexOf(k) !== -1; }); }

/* ── 개인정보 ── */
var PHONE = /01[016789][-\s]?\d{3,4}[-\s]?\d{4}/g;
var NAMED = /([가-힣]{2,4})\s?(사원|주임|대리|과장|차장|부장|팀장|이사|님|씨)/g;
/* 일반명사는 이름이 아니다 */
var NOT_NAME = ["신입","부하","우리","저희","해당","다른","모든","일부","전체","경력","기존","현재",
                "새로","막내","선임","후임","중간","담당","실무","현장","영업","개발","기획","인사"];
function isName(g){ return NOT_NAME.indexOf(g) === -1 && !/^(그|이|저)$/.test(g); }
function findPII(text){
  var t = String(text||""), out = [], m;
  PHONE.lastIndex = 0; NAMED.lastIndex = 0;
  if(PHONE.test(t)) out.push("전화번호");
  PHONE.lastIndex = 0;
  while((m = NAMED.exec(t)) !== null){
    if(isName(m[1])){ out.push("이름·직급"); break; }
  }
  NAMED.lastIndex = 0;
  return out;
}
function maskPII(text){
  return String(text||"")
    .replace(PHONE, "***-****-****")
    .replace(NAMED, function(all, g1, g2){ return isName(g1) ? "○○ " + g2 : all; });
}

/* ── 유형 판정 ── */
function detectType(text){
  var t = norm(text);
  return Object.keys(TYPE_KEYWORDS).map(function(type){
    var n = 0;
    TYPE_KEYWORDS[type].forEach(function(k){ if(t.indexOf(k) !== -1) n++; });
    return { type:type, n:n };
  }).filter(function(x){ return x.n > 0; }).sort(function(a,b){ return b.n - a.n; });
}

/* ── 입력 유효성 ── */
function isLong(raw){ return String(raw||"").trim().length > 400; }

function inputKind(raw){
  var s = String(raw||"").trim();
  if(!s) return "empty";
  if(/^[0-9\s]+$/.test(s)) return "numeric";
  if(!/[가-힣a-zA-Z]/.test(s)) return "symbol";
  if(fix(s).replace(/[^가-힣a-zA-Z]/g,"").length < 4) return "tooShort";
  return "ok";
}

/* ── 모순 탐지 ── */
function findConflict(text){
  var t = norm(text);
  var isNew = /신입|입사한 지|들어온 지|새로 온|온 지/.test(t);
  var yrs = t.match(/(\d+)\s*년/);
  if(isNew && yrs && parseInt(yrs[1],10) >= 2)
    return "신입이라고 하셨는데 " + yrs[1] + "년 경력도 함께 적어주셨어요. 경력직으로 입사한 분일까요, 아니면 다른 분 이야기일까요?";
  var wk = t.match(/(\d+)\s*(주|개월)/);
  if(wk && /오래|계속 해온|쭉/.test(t) && parseInt(wk[1],10) <= 4)
    return "합류한 지 얼마 안 됐다고 하셨는데 오래 해온 업무라는 말씀도 있어요. 어느 쪽인지 알려주시면 사례를 더 정확히 찾을 수 있어요.";
  return null;
}

/* ── 슬롯 ── */
function slots(text){
  var t = norm(text);
  return {
    type:  detectType(t).length > 0,
    when:  has(t, WHEN_MARK) || /\d/.test(t),
    prior: has(t, PRIOR_MARK),
    goal:  has(t, GOAL_MARK),
  };
}
function filled(s){ return ["type","when","prior","goal"].filter(function(k){ return s[k]; }).length; }

/* ── 의도 분류 ── */
function classify(raw, story){
  var kind = inputKind(raw);
  if(kind !== "ok") return { intent: kind };

  var t = norm(raw), all = norm(story + " " + raw);

  if(has(t, SCOPE_SELF))   return { intent:"scopeSelf" };
  if(has(t, SCOPE_POLICY)) return { intent:"scopePolicy" };
  if(has(t, SCOPE_STRONG)) return { intent:"scopeCasual" };
  if(has(t, SCOPE_CASUAL) && !detectType(t).length) return { intent:"scopeCasual" };

  if(has(t, REJECT_MARK) && story)   return { intent:"reject" };
  if(has(t, REDIRECT_MARK))          return { intent:"redirect" };
  if(has(t, FOLLOWUP_MARK) && story) return { intent:"followup" };

  var conflict = findConflict(all);
  if(conflict) return { intent:"conflict", msg:conflict };

  var types = detectType(all);
  if(types.length >= 3 || (types.length >= 2 && types[0].n >= 2 && types[1].n >= 2))
    return { intent:"multi", types: types.slice(0,3) };

  var emo = has(t, EMO_MARK) && detectType(t).length === 0;
  if(emo) return { intent:"emotionOnly" };

  return { intent:"normal" };
}

var ASKS = {
  type:  "어떤 일이 있었는지 조금만 더 들려주실 수 있을까요? 상황이 잡혀야 비슷한 사례를 찾을 수 있어요.",
  when:  "언제부터, 얼마나 자주 있었나요? 기간이나 횟수가 있으면 훨씬 정확하게 찾을 수 있어요.",
  prior: "지금까지 이 건으로 따로 말씀하신 적이 있으세요? 없으면 “없다”고만 하셔도 괜찮아요.",
  goal:  "이 대화가 끝났을 때 어떤 상태이길 원하세요? 행동만 바뀌면 되는지, 관계도 같이 챙기고 싶은지에 따라 첫 문장이 달라져요.",
};
function nextAsk(text, asked){
  var s = slots(text), order = ["type","when","prior","goal"];
  for(var i=0;i<order.length;i++){
    if(!s[order[i]] && asked.indexOf(order[i]) === -1) return { key:order[i], q:ASKS[order[i]] };
  }
  return null;
}

function empathy(text){
  var ty = detectType(text)[0];
  return (ty && EMPATHY[ty.type]) || "말을 꺼내야 하는데 첫 문장이 안 떠오르는 상황, 자주 있죠.";
}

/* ── 사례 검색 ── */
function findCases(text, excludeApproach, excludeIds){
  var typeScores = detectType(text);
  if(!typeScores.length) return { type:null, matched:[] };
  excludeApproach = excludeApproach || [];
  excludeIds = excludeIds || [];

  function collect(depth){
    var allow = {};
    typeScores.slice(0, depth).forEach(function(x,i){ allow[x.type] = i === 0 ? x.n * 10 : 10; });
    var t = norm(text);
    return window.CASES.cases.map(function(c){
      if(!(c.type in allow)) return { c:c, s:0 };
      if(excludeApproach.indexOf(c.approachKey) !== -1) return { c:c, s:0 };
      if(excludeIds.indexOf(c.id) !== -1) return { c:c, s:0 };
      var sc = allow[c.type];
      (TYPE_KEYWORDS[c.type] || []).forEach(function(k){
        if(t.indexOf(k) !== -1 && (c.situation.indexOf(k) !== -1 || c.action.indexOf(k) !== -1)) sc += 3;
      });
      if(c.source === "real") sc += 2;
      return { c:c, s:sc };
    }).filter(function(x){ return x.s >= 10; })
      .sort(function(a,b){ return b.s - a.s; })
      .map(function(x){ return x.c; });
  }
  var m = collect(1);
  if(m.length < 3 && typeScores.length > 1) m = collect(2);
  return { type: typeScores[0].type, matched: m };
}

/* 유형을 외부에서 지정해 검색 (API가 판정한 유형 사용) */
function findCasesByType(type, query, excludeApproach, excludeIds){
  if(!type) return findCases(query || "", excludeApproach, excludeIds);
  excludeApproach = excludeApproach || []; excludeIds = excludeIds || [];
  var t = norm(query || "");
  var matched = window.CASES.cases.map(function(c){
    if(c.type !== type) return { c:c, s:0 };
    if(excludeApproach.indexOf(c.approachKey) !== -1) return { c:c, s:0 };
    if(excludeIds.indexOf(c.id) !== -1) return { c:c, s:0 };
    var sc = 10;
    (TYPE_KEYWORDS[type] || []).forEach(function(k){
      if(t.indexOf(k) !== -1 && (c.situation.indexOf(k) !== -1 || c.action.indexOf(k) !== -1)) sc += 3;
    });
    if(c.source === "real") sc += 2;
    return { c:c, s:sc };
  }).filter(function(x){ return x.s >= 10; })
    .sort(function(a,b){ return b.s - a.s; })
    .map(function(x){ return x.c; });
  return { type: type, matched: matched };
}

function outcomeLabel(o){
  return o === "positive" ? "개선됨" : o === "negative" ? "악화됨" : "절반만 해결";
}

/* ── 접근 방식별 묶기 ── */
function buildOptions(matched, goalText){
  var groups = {};
  matched.forEach(function(c){
    var k = c.approachKey || "Z";
    if(!groups[k]) groups[k] = [];
    groups[k].push(c);
  });
  var wantsRelation = /관계|사이|서운|어색|상처|유지/.test(norm(goalText || ""));

  var opts = Object.keys(groups).map(function(k){
    var list = groups[k], rep = list[0];
    var pos = list.filter(function(c){ return c.outcome === "positive"; }).length;
    var neg = list.filter(function(c){ return c.outcome === "negative"; }).length;
    var tone = "amber", note = "";
    if(pos > neg && pos >= Math.ceil(list.length/2)) tone = "mint";
    else if(neg >= pos && neg > 0) tone = "coral";
    if(wantsRelation && neg > pos){
      tone = "coral";
      note = "관계를 지키고 싶다고 하셨는데, 이 방식은 그 목표와 어긋난 사례가 더 많았어요.";
    }
    return {
      key:k, approach:rep.approach, desc:rep.approachDesc, tone:tone, note:note,
      rep:rep, cases:list, count:list.length, pos:pos, neg:neg,
      basis: list.length === 1
        ? "유사 사례 1건 · " + outcomeLabel(rep.outcome)
        : "유사 사례 " + list.length + "건 중 " + pos + "건 개선" + (neg ? " · " + neg + "건 악화" : ""),
      score: list.length * 10 + pos * 3,
    };
  });
  opts.sort(function(a,b){
    if((a.tone === "coral") !== (b.tone === "coral")) return a.tone === "coral" ? 1 : -1;
    return b.score - a.score;
  });
  return opts.slice(0,3);
}

/* 사실만 추출 (해석은 결과에 노출하지 않음) */
function factsOf(text){
  return norm(text).split(/[.!?。]\s*|\n+/).map(function(s){ return s.trim(); })
    .filter(function(s){ return s.length > 4 && !has(s, GUESS_MARK); })
    .slice(0, 4);
}

window.ENGINE = {
  norm:norm, fix:fix, isLong:isLong, detectType:detectType, inputKind:inputKind, classify:classify,
  slots:slots, filled:filled, nextAsk:nextAsk, empathy:empathy,
  findCases:findCases, findCasesByType:findCasesByType, buildOptions:buildOptions, makePoint:makePoint,
  outcomeLabel:outcomeLabel, factsOf:factsOf, findPII:findPII, maskPII:maskPII,
  TYPE_KEYWORDS:TYPE_KEYWORDS,
};
})();

</script>
<script>
const IS_TOUCH = ("ontouchstart" in window) || navigator.maxTouchPoints > 0;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const E = () => window.ENGINE;

const EXAMPLES = [
  "팀원이 3주째 지각을 해요",
  "두 팀원이 서로 일을 미뤄요",
  "피드백을 하면 늘 변명부터 해요",
  "잘하던 팀원 성과가 갑자기 떨어졌어요",
];

const PRINCIPLES = [
  ["관찰한 것만 먼저","사실과 해석을 섞지 않고 본 것만 말합니다"],
  ["첫 문장에 평가어 빼기","“요즘 왜 그래요”는 이미 평가입니다"],
  ["기준보다 사정을 먼저","순서가 방어 여부를 가릅니다"],
];

let convo = [], apiDown = false, aiType = null, aiQuery = "";
let view = "land", msgs = [], story = "", asked = [], typing = false,
    done = false, openId = null, result = null,
    usedApproach = [], usedIds = [], lastFocus = "";

/* ───────── 렌더 ───────── */
function render(){
  const m = $("#main");
  $("#composer").classList.toggle("hidden", view !== "chat");
  $("#foot").classList.toggle("hidden", view !== "land");
  $("#restart").style.visibility = view === "land" ? "hidden" : "visible";

  if(view === "land")        m.innerHTML = landHTML();
  else if(view === "chat")   m.innerHTML = `<div class="wrap" style="padding-top:8px">${chatHTML()}</div>`;
  else if(view === "loading")m.innerHTML = `<div class="wrap"><div class="load"><div class="spinner"></div><div class="t">비슷한 상황을 찾는 중이에요</div></div></div>`;
  else                       m.innerHTML = `<div class="wrap">${resultHTML()}</div>`;

  bind();
  if(view === "chat" || view === "result") m.scrollTop = m.scrollHeight;
  sync();
}

function landHTML(){
  return `<div class="land">
    <div class="hi">현장 위주 리더십 챗봇</div>
    <h1>어려운 대화를 앞두고<br><span class="g">첫 문장</span>이 막혔다면</h1>
    <p class="lead">비슷한 상황을 겪은 팀장들이 실제로 어떻게 말했고,<br>그래서 어떻게 됐는지 보여드릴게요.</p>

    <div class="kit">
      <p>이런 내용을 함께 적어주시면 더 깊이 같이 고민할 수 있어요 ✨</p>
      <ul>
        <li><i>🗓️</i><span>무슨 일이 있었는지 — 언제부터, 얼마나 자주</span></li>
        <li><i>💬</i><span>지금까지 어떻게 하셨는지</span></li>
        <li><i>🎯</i><span>대화가 끝나면 어떤 상태이길 원하시는지</span></li>
      </ul>
    </div>

    <div class="bigbox">
      <textarea id="land-draft" rows="2" placeholder="어떤 상황인지 편하게 적어주세요"></textarea>
      <button class="go" id="land-go">↑</button>
    </div>
    <div class="exs">${EXAMPLES.map(t=>`<button data-ex="${esc(t)}">${esc(t)}</button>`).join("")}</div>
  </div>`;
}

function chatHTML(){
  let h = "";
  msgs.forEach((x,i)=>{
    if(x.who === "bot"){
      h += `<div class="row"><span class="av">L</span><div class="bot">${esc(x.text)}</div></div>`;
      if(x.chips && i === msgs.length-1 && !typing)
        h += `<div class="chips">${x.chips.map((c,j)=>`<button data-chip="${j}">${esc(c.label)}</button>`).join("")}</div>`;
    } else {
      h += `<div class="me-row"><div class="me">${esc(x.text)}</div></div>`;
    }
  });
  if(typing) h += `<div class="row"><span style="width:28px;flex-shrink:0"></span><div class="typing"><i></i><i></i><i></i></div></div>`;
  return h;
}

function resultHTML(){
  const r = result;
  let h = `<div class="card hero">
    <div class="eb">지금 상황</div>
    <div class="pt">${esc(r.point)}</div>
    ${r.type ? `<span class="tag">${esc(r.type)}</span>` : ""}
    ${r.facts.length ? `<div class="dv"><h5>적어주신 내용에서</h5>${r.facts.map(f=>`<p>· ${esc(f)}</p>`).join("")}</div>` : ""}
  </div>`;

  if(!r.options.length){
    h += `<div class="card soft"><b>딱 맞는 사례가 아직 없어요</b>
      <p>비슷한 조건의 사례가 쌓이면 실제 대응과 결과를 보여드릴게요. 지금은 원칙만 정리해 드립니다.</p></div>
      <div class="sect"><b>일반 원칙</b><span></span></div>
      <div class="card">${PRINCIPLES.map(([t,d])=>`<div class="pr"><b>${t}</b><p>${d}</p></div>`).join("")}</div>
      <div class="card hrbox"><b>사내 HR 채널도 함께 확인해보세요</b>
        <p>반복되거나 규정이 얽힌 사안은 이 도구만으로 판단하지 않는 편이 낫습니다.</p></div>`;
  } else {
    h += `<div class="sect"><b>무엇을 먼저 하느냐에 따라</b><span>유사 사례 ${r.total}건 기준</span></div>`;
    h += r.options.map(optHTML).join("");
  }

  h += `<div class="card contrib" style="margin-top:18px"><b>대화가 끝나면 결과를 남겨주세요</b>
    <p>어떻게 말했고 어떻게 됐는지가 다음 팀장에게 사례가 됩니다.</p></div>
    <p class="src">현장 리더들에게 수집한 사례와 이를 바탕으로 보강한 사례를 함께 사용합니다.</p>
    <div class="actions">
      <button id="more">다른 방법도 볼래요</button>
      <button class="pri" id="again">새 상황 물어보기</button>
    </div>`;
  return h;
}

function optHTML(o){
  const c = o.rep, on = openId === o.key;
  const others = o.cases.slice(1,4);
  return `<div class="card opt${on?" on":""}">
    <button data-opt="${o.key}">
      <div class="tags"><span class="tag ${o.tone}">${esc(o.approach)}</span><span class="basis">${esc(o.basis)}</span></div>
      <div class="head"><b>${esc(c.lesson)}</b><span class="chev">⌄</span></div>
      <div class="adesc">${esc(o.desc)}</div>
    </button>
    ${on ? `<div class="body">
      ${o.note ? `<div class="note">${esc(o.note)}</div>` : ""}
      <div class="first">
        <div class="top"><span class="lbl">이 리더가 실제로 한 말</span>
          <button class="copy" data-copy="${esc(c.firstLine)}">복사</button></div>
        <div class="txt">“${esc(c.firstLine)}”</div>
      </div>
      <div class="stat">
        <span>${esc(c.org.industry.split("/")[0])}</span>
        <span>${esc(c.org.companySize)}</span>
        <span>팀 ${esc(c.org.teamSize)}</span>
      </div>
      <div class="kv"><b>어떤 상황이었나</b><p>${esc(c.situation)}</p></div>
      <div class="kv"><b>어떻게 했나</b><p>${esc(c.action)}</p></div>
      ${c.reason ? `<div class="kv"><b>왜 그렇게 했나</b><p>${esc(c.reason)}</p></div>` : ""}
      <div class="kv"><b>팀원의 반응</b><p>${esc(c.reaction)}</p></div>
      <div class="kv"><b>그래서 어떻게 됐나</b><p>${esc(c.outcomeDetail)}</p></div>
      ${others.length ? `<div class="more"><h6>같은 방식을 쓴 다른 사례</h6>
        ${others.map(x=>`<div class="mini"><b>${esc(E().outcomeLabel(x.outcome))}</b> · ${esc(x.lesson)}</div>`).join("")}</div>` : ""}
    </div>` : ""}
  </div>`;
}

/* ───────── 이벤트 ───────── */
function bind(){
  const lg = $("#land-go"), ld = $("#land-draft");
  if(ld){
    ld.oninput = ()=>{ lg.classList.toggle("on", !!ld.value.length); };
    ld.onkeydown = e=>{ if(e.key==="Enter" && !e.shiftKey && !IS_TOUCH){ e.preventDefault(); start(ld.value); } };
    lg.onclick = ()=> start(ld.value);
    document.querySelectorAll("[data-ex]").forEach(b=>{ b.onclick = ()=> start(b.dataset.ex); });
    setTimeout(()=>{ if(!IS_TOUCH) ld.focus(); }, 60);
  }
  document.querySelectorAll("[data-chip]").forEach(b=>{
    b.onclick = ()=>{
      const last = msgs[msgs.length-1];
      const c = last.chips[+b.dataset.chip];
      last.chips = null;
      if(c.send){ push("me", c.send); story += " " + c.send; }
      if(c.focus) lastFocus = c.focus;
      c.run ? c.run() : go();
    };
  });
  document.querySelectorAll("[data-opt]").forEach(b=>{
    b.onclick = ()=>{ openId = (openId === b.dataset.opt ? null : b.dataset.opt); render(); };
  });
  document.querySelectorAll("[data-copy]").forEach(b=>{
    b.onclick = e=>{
      e.stopPropagation();
      const ta = document.createElement("textarea");
      ta.value = b.dataset.copy; ta.style.position="fixed"; ta.style.opacity="0";
      document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); }catch(err){}
      document.body.removeChild(ta);
      b.textContent = "복사됨"; b.classList.add("done");
      setTimeout(()=>{ b.textContent="복사"; b.classList.remove("done"); }, 1600);
    };
  });
  const ag = $("#again"); if(ag) ag.onclick = reset;
  const mo = $("#more");  if(mo) mo.onclick = moreOptions;
}

function sync(){
  const s = $("#send");
  if(s) s.classList.toggle("on", !!$("#draft").value.trim() && !done);
}

function push(who, text, extra){ msgs.push(Object.assign({who, text}, extra||{})); }

function say(text, extra, delay){
  typing = true; render();
  setTimeout(()=>{ typing = false; push("bot", text, extra); render(); }, delay || 950);
}

function reset(){
  view = "land"; msgs = []; story = ""; asked = []; typing = false; done = false;
  openId = null; result = null; usedApproach = []; usedIds = []; lastFocus = "";
  convo = []; aiType = null; aiQuery = "";
  render();
}

async function handle(raw){
  const en = E();

  // 입력 유효성은 로컬에서 즉시 판단 (API 호출 낭비 방지)
  const kind = en.inputKind(raw);
  if(kind !== "ok"){ handleLocal(raw, false); return; }

  const pii = en.findPII(raw);
  const clean = pii.length ? en.maskPII(raw) : raw;
  push("me", clean); render();
  story += " " + clean;

  if(apiDown){ handleLocal(clean, true); return; }

  convo.push({ role:"user", content: clean });
  typing = true; render();

  try{
    const ctrl = new AbortController();
    const timer = setTimeout(()=> ctrl.abort(), 15000);
    const r = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: convo }),
      signal: ctrl.signal,
    });
    clearTimeout(timer);
    if(!r.ok) throw new Error("status " + r.status);
    const data = await r.json();
    if(data.error) throw new Error(data.error);

    typing = false;
    convo.push({ role:"assistant", content: JSON.stringify(data) });

    const note = pii.length ? "혹시 몰라 " + pii.join("·") + "는 지웠어요. 사례를 찾는 데 필요하지 않아요 🙂\n\n" : "";

    if(data.status === "outOfScope"){
      push("bot", note + data.reply, { chips: [{ label:"다른 상황 이야기하기", run: reset }] });
      render(); return;
    }
    if(data.status === "ready"){
      aiType = data.type || null;
      aiQuery = data.query || "";
      push("bot", note + data.reply); render();
      setTimeout(()=> go(true), 1100);
      return;
    }
    push("bot", note + data.reply, { chips: [{ label:"이대로 찾아줘", run: ()=> go() }] });
    render();

  }catch(err){
    typing = false;
    apiDown = true;
    push("bot", "지금 연결이 원활하지 않아 간단한 방식으로 이어갈게요.");
    render();
    setTimeout(()=> handleLocal(clean, true), 900);
  }
}

function start(text){
  const raw = text || "";
  if(!raw.length) return;
  view = "chat"; render();
  setTimeout(()=> handle(raw), 30);
}

/* ───────── 대화 처리 ───────── */
function handleLocal(raw, pushed){
  const en = E();
  const kind = en.inputKind(raw);

  if(kind !== "ok"){
    if(!pushed){ push("me", raw); render(); }
    const M = {
      empty:   "내용이 비어 있는 것 같아요. 어떤 상황인지 한 줄이라도 적어주시면 같이 볼게요.",
      symbol:  "글자로 적어주시면 제가 읽을 수 있어요. 어떤 일이 있었는지 편하게 적어주세요.",
      numeric: "숫자만으로는 상황을 알기 어려워요. 무슨 일이 있었는지 문장으로 적어주시겠어요?",
      tooShort:"조금만 더 적어주실 수 있을까요? 어떤 일이 언제부터 있었는지 알면 비슷한 사례를 찾을 수 있어요.",
    };
    say(M[kind], null, 700);
    return;
  }

  const pii = en.findPII(raw);
  const clean = pii.length ? en.maskPII(raw) : raw;
  if(!pushed){ push("me", clean); render(); }

  const c = en.classify(clean, story);
  const piiNote = pii.length ? "혹시 몰라 " + pii.join("·") + "는 지우고 볼게요. 사례를 찾는 데 필요하지 않아요 🙂\n\n" : "";

  switch(c.intent){
    case "scopeSelf":
      say(piiNote + "이 도구는 팀장이 팀원과 나눌 대화를 준비하는 데 쓰는 도구예요.\n\n적어주신 내용은 대화 방법만으로 다루기 어려워 보입니다. 사내 HR 채널이나 고충 처리 절차를 먼저 확인해보시는 편이 안전해요.", null, 1100);
      return;

    case "scopePolicy":
      say(piiNote + "규정이나 법적 판단이 걸린 사안은 제가 단정해서 말씀드리기 어려워요. 회사마다 취업규칙이 다르고, 잘못 안내하면 더 곤란해질 수 있어서요.\n\n그 부분은 인사팀이나 노무 담당자에게 먼저 확인하시는 게 좋겠습니다.\n\n다만 그와 별개로, 그 팀원과 나눌 대화를 어떻게 열지는 같이 볼 수 있어요. 어떤 상황인지 조금 더 들려주시겠어요?", null, 1300);
      return;

    case "scopeCasual":
      say(piiNote + "그건 제가 도와드리기 어려운 주제예요 😅\n\n저는 팀원과 나눌 어려운 대화를 준비하는 걸 돕습니다. 지각, 업무 실수, 팀원 간 갈등, 피드백처럼요.\n\n요즘 마음에 걸리는 팀원 이야기가 있으시면 편하게 적어주세요.", null, 1000);
      return;

    case "conflict":
      story += " " + clean;
      say(piiNote + c.msg, null, 1100);
      return;

    case "multi": {
      story += " " + clean;
      const chips = c.types.map(x => ({ label: x.type, send: x.type + " 쪽부터 볼게요", focus: x.type }));
      say(piiNote + "여러 가지가 한꺼번에 겹쳐 있네요. 그럴 때는 하나씩 푸는 게 빠릅니다.\n\n" +
          c.types.map((x,i)=>`${i+1}. ${x.type}`).join("\n") +
          "\n\n어느 것부터 이야기해볼까요? 제일 급한 것 하나만 골라주세요.", { chips }, 1300);
      return;
    }

    case "redirect": {
      story += " " + clean;
      const ty = en.detectType(clean)[0];
      lastFocus = ty ? ty.type : "";
      say((ty ? ty.type + " 쪽으로 보는 거군요. " : "알겠습니다. ") +
          "그럼 그 기준으로 다시 볼게요.\n\n" + empathyAsk(), null, 1000);
      return;
    }

    case "reject":
      story += " " + clean;
      say("이미 해보셨는데 안 됐군요. 그럼 같은 방식을 또 권하는 건 의미가 없겠네요.\n\n다른 접근으로 찾아볼게요.", null, 1000);
      setTimeout(moreOptions, 1900);
      return;

    case "followup":
      story += " " + clean;
      say("앞서 나눈 상황 이어서 보는 걸로 할게요.\n\n한 번 시도해보셨는데 변화가 없었다면, 방식보다 순서가 문제였을 수 있어요. 그때 어떻게 말씀하셨는지 짧게만 알려주시겠어요?", null, 1200);
      return;

    case "emotionOnly":
      story += " " + clean;
      say(piiNote + "그런 상황이면 답답하실 만해요. 말이 안 통한다고 느껴질 때가 제일 지치죠.\n\n조금만 더 구체적으로 여쭤볼게요. 어떤 일이 있었을 때 그렇게 느끼셨나요? 최근에 있었던 장면 하나만 떠올려 적어주시면 좋겠어요.", null, 1200);
      return;
  }

  /* ── 일반 ── */
  if(!pushed) story += " " + clean;
  const sl = en.slots(story);
  const n = en.filled(sl);

  let lead = piiNote;
  if(en.isLong(clean)){
    const ty = en.detectType(clean)[0];
    lead += "길게 적어주셔서 상황이 잘 보여요. 핵심만 정리하면 "
          + (ty ? ty.type + " 문제" : "말 꺼내기 어려운 상황")
          + "로 이해했습니다.\n\n";
  }

  if(n >= 3 || asked.length >= 3){
    if(lead){
      say(lead + "이 정도면 충분해요. 비슷한 사례를 찾아볼게요.", null, 900);
      setTimeout(()=> go(true), 1200);
    } else {
      go();
    }
    return;
  }

  const ask = en.nextAsk(story, asked);
  if(!ask){ go(); return; }
  asked.push(ask.key);

  if(!lead && msgs.filter(x=>x.who==="bot").length <= 1) lead = en.empathy(story) + "\n\n";
  say(lead + ask.q, { chips: [{ label:"이대로 찾아줘", run: go }] }, 1150);
}

function empathyAsk(){
  const en = E(), ask = en.nextAsk(story, asked);
  if(ask){ asked.push(ask.key); return ask.q; }
  return "조금 더 들려주시면 사례를 찾아볼게요.";
}

/* ───────── 결과 ───────── */
function go(silent){
  done = true;
  if(!silent) say("알겠습니다. 비슷한 상황을 겪은 팀장들 사례를 찾아볼게요.", null, 700);
  setTimeout(()=>{
    view = "loading"; render();
    setTimeout(()=>{ compute(false); done = false; }, 850);
  }, silent ? 300 : 1600);
}

function compute(exclude){
  const en = E();
  const ex1 = exclude ? usedApproach : [];
  const ex2 = exclude ? usedIds : [];
  const query = (aiQuery ? aiQuery + " " : "") + (lastFocus ? lastFocus + " " : "") + story;
  const f = aiType
    ? en.findCasesByType(aiType, query, ex1, ex2)
    : en.findCases(query, ex1, ex2);
  const options = en.buildOptions(f.matched, story);
  options.forEach(o=>{
    if(usedApproach.indexOf(o.key) === -1) usedApproach.push(o.key);
    if(usedIds.indexOf(o.rep.id) === -1) usedIds.push(o.rep.id);
  });
  result = {
    facts: en.factsOf(story), type: f.type, options,
    total: f.matched.length, point: en.makePoint(f.type, f.matched),
  };
  openId = options.length ? options[0].key : null;
  view = "result"; render();
}

function moreOptions(){
  const en = E();
  const query = lastFocus ? (lastFocus + " " + story) : story;
  const f = en.findCases(query, usedApproach, usedIds);
  if(!f.matched.length){
    view = "chat"; done = true; render();
    say("같은 유형에서 보여드릴 다른 방식은 여기까지예요.\n\n상황을 조금 다르게 설명해주시면 새로 찾아볼 수 있어요. 무엇이 달랐는지 알려주시겠어요?", null, 900);
    setTimeout(()=>{ done = false; sync(); }, 1100);
    return;
  }
  view = "loading"; render();
  setTimeout(()=>{ compute(true); }, 700);
}

/* ───────── 입력 ───────── */
function send(){
  try{
    const raw = $("#draft").value;
    if(done) return;
    if(!raw.length) return;
    $("#draft").value = ""; $("#draft").rows = 1;
    handle(raw);
  }catch(err){
    typing = false;
    push("bot", "처리 중 문제가 생겼어요.\n\n" + (err && err.message ? err.message : String(err)));
    render();
  }
}
$("#send").onclick = send;
$("#restart").onclick = reset;
$("#draft").oninput = e=>{ e.target.rows = Math.min(4, e.target.value.split("\n").length); sync(); };
$("#draft").onkeydown = e=>{ if(e.key==="Enter" && !e.shiftKey && !IS_TOUCH){ e.preventDefault(); send(); } };

reset();
</script>
